# Local development database only, not for production.
services:
  vibeschedule-postgres:
    image: postgres:18-alpine
    container_name: vibeschedule-postgres
    restart: always
    environment:
      POSTGRES_USER: vibeschedule
      POSTGRES_PASSWORD: vibeschedule
      POSTGRES_DB: vibeschedule
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    ports:
      - 5432:5432

volumes:
  postgres-volume:
